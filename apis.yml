name: Qualified Health
description: Qualified Health is an enterprise, healthcare-native generative AI platform for health
  systems. It provides a single integration point into clinical, operational, and financial systems,
  a library of pre-built and validated AI solutions, an agent and workflow builder, unified real-time
  governance with audit trails and safety checks, and outcomes tracking across clinical, operational,
  and financial impact. The company is backed by Menlo Ventures and serves health systems including
  the University of Texas System, Emory Healthcare, Jefferson Health, University of Rochester Medical
  Center, and Mercy. No public developer API, SDK, or API reference is published; integration is
  delivered through enterprise engagements.
